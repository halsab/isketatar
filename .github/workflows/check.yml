name: Check and release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'pages-production' || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      acceptance: ${{ steps.acceptance.outputs.status }}
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - id: acceptance
        run: npm run check:acceptance
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Critical browser coverage
        if: github.event_name == 'pull_request' || steps.acceptance.outputs.status != 'approved'
        run: npm run test:e2e -- --grep-invert '@full'
      - name: Full release browser coverage
        if: github.event_name == 'push' && steps.acceptance.outputs.status == 'approved'
        run: npm run test:e2e
      - name: Twenty cold performance runs
        if: github.event_name == 'push' && steps.acceptance.outputs.status == 'approved'
        run: npm run test:performance
      - name: Package the checked candidate
        if: github.event_name == 'push' && steps.acceptance.outputs.status == 'approved'
        run: |
          npm run prepare:release
          cp quality-results/bundle-graph.json quality-results/release/bundle-graph.json
          cp quality-results/performance/summary.json quality-results/release/performance.json
          cp docs/development/external-acceptance.json quality-results/release/acceptance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: candidate
        if: github.event_name == 'push' && steps.acceptance.outputs.status == 'approved'
        with:
          name: checked-candidate
          path: quality-results/release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality
          path: |
            test-results/
            quality-results/performance/
            quality-results/build-provenance.json
            quality-results/budgets.json
          retention-days: 14
          overwrite: true

  candidate:
    if: github.event_name == 'push' && github.repository == 'halsab/isketatar'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      pages_id: ${{ steps.pages.outputs.artifact-id }}
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      profile_id: ${{ steps.profile.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - name: Require completed external acceptance
        env:
          ACCEPTANCE: ${{ needs.check.outputs.acceptance }}
        run: |
          if [ "$ACCEPTANCE" != approved ]; then
            echo 'Publication blocked: complete the language, subject, pilot and platform acceptance in docs/development/external-acceptance.json.'
            exit 1
          fi
      - name: Require protected main
        env:
          PROTECTED: ${{ github.ref_protected }}
        run: test "$PROTECTED" = true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run generate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.check.outputs.candidate_id }}
          path: quality-results/candidate
          merge-multiple: true
          digest-mismatch: error
      - run: node tools/github-release.mjs unpack-candidate
      - run: npm run check:acceptance -- --require-approved
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/github-release.mjs discover
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.previous.outputs.mode == 'last-good'
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
          path: quality-results/previous
          merge-multiple: true
          digest-mismatch: error
      - if: steps.previous.outputs.mode == 'last-good'
        run: |
          node tools/github-release.mjs unpack-previous
          echo 'PREVIOUS_DIST=quality-results/previous/dist' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:delivery
      - run: node tools/published-smoke.mjs seed
      - id: package
        run: |
          npm run prepare:release
          cp quality-results/candidate/performance.json quality-results/release/performance.json
          cp quality-results/candidate/acceptance.json quality-results/release/acceptance.json
          cp quality-results/delivery-smoke.json quality-results/release/delivery-smoke.json
          cp quality-results/previous-release.json quality-results/release/previous-release.json
          node --input-type=module -e "import {readFile,appendFile} from 'node:fs/promises';const e=JSON.parse(await readFile('quality-results/release/release-evidence.json'));await appendFile(process.env.GITHUB_OUTPUT,'archive_sha256='+e.archive_sha256+'\n');"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: pages
        with:
          name: github-pages
          path: quality-results/release/artifact.tar
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: bundle
        with:
          name: release-candidate
          path: quality-results/release/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: profile
        with:
          name: test-profile
          path: quality-results/predeploy-profile.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: candidate
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      pages_id: ${{ needs.candidate.outputs.pages_id }}
      bundle_id: ${{ needs.candidate.outputs.bundle_id }}
      profile_id: ${{ needs.candidate.outputs.profile_id }}
      archive_sha256: ${{ needs.candidate.outputs.archive_sha256 }}
